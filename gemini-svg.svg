<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%" style="border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);">
  <defs>
    <!-- Complex Dark Core Gradient -->
    <linearGradient id="deep-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Geographic Accent Glow (Cyan/Green) -->
    <linearGradient id="geo-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    
    <!-- Red Accent for Pin -->
    <linearGradient id="pin-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Map Pin Symbol (Advanced) -->
    <symbol id="icon-pin" viewBox="0 0 24 24">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </symbol>

    <!-- CSS for Animations and Effects -->
    <style>
      @keyframes floatIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pinDrop {
        0% { opacity: 0; transform: translateY(-30px) rotate(10deg); }
        80% { transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      .stagger-in { animation: floatIn 0.7s ease-out forwards; opacity: 0; }
      .stagger-1 { animation-delay: 0.2s; }
      .stagger-2 { animation-delay: 0.4s; }
      .stagger-3 { animation-delay: 0.6s; }
      .pindrop { animation: pinDrop 0.8s ease-out forwards; opacity: 0; animation-delay: 0.7s;}

      .skill-tag { transition: all 0.3s ease; }
      .skill-tag:hover { fill: #334155; transform: scale(1.05) translateY(-2px); }
      
      .avatar-glow { transition: opacity 0.5s ease; }
      .avatar-group:hover .avatar-glow { opacity: 0.6; }
    </style>
  </defs>

  <!-- BACKGROUND: Deep Gradient with noise texture -->
  <rect width="1200" height="450" fill="url(#deep-gradient)"/>
  <rect width="1200" height="450" fill="url(#grid-pattern)" opacity="0.05"/>

  <!-- Left Side: Interactive Avatar and Tech -->
  <g transform="translate(60, 60)" class="avatar-group" cursor="pointer">
    <!-- Hover Glow -->
    <circle cx="100" cy="100" r="110" fill="#2dd4bf" opacity="0.1" filter="blur(30px)" class="avatar-glow"/>
    
    <!-- Outer Ring (Animated stroke) -->
    <circle cx="100" cy="100" r="100" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8"/>
    
    <!-- Avatar Image (Masked) -->
    <defs>
      <clipPath id="circle-clip">
        <circle cx="100" cy="100" r="95" />
      </clipPath>
    </defs>
    <image href="image_a71fdd.jpg" x="5" y="5" width="190" height="190" clip-path="url(#circle-clip)"/>
    
    <!-- Red Online Status Dot -->
    <circle cx="178" cy="165" r="12" fill="#ef4444" stroke="#020617" stroke-width="3"/>
  
    <!-- Location Tag (Stagger-In) -->
    <g transform="translate(20, 220)" class="stagger-in stagger-3">
        <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="80" y="22" font-family="system-ui, -apple-system" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">Canterbury, NZ</text>
    </g>
  </g>

  <!-- Center Content: Text & Mission (Stagger-In) -->
  <g transform="translate(320, 110)">
    <!-- Name -->
    <text x="0" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#f8fafc" class="stagger-in stagger-1" letter-spacing="-0.5">
      Melanie van Enter
    </text>

    <!-- Single, Clean Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system" font-size="24" font-weight="600" fill="url(#geo-accent)" class="stagger-in stagger-2" letter-spacing="1">
      Geospatial Specialist
    </text>

    <!-- Tagline (Charcoal/Blue) -->
    <text x="0" y="130" font-family="system-ui, -apple-system" font-size="18" font-weight="400" fill="#94a3b8" class="stagger-in stagger-3" max-width="500">
      Automating pipelines, wrangling data, and building beautiful,
      <tspan x="0" dy="24">readable maps from open spatial data.</tspan>
    </text>
  </g>

  <!-- Right Side: Topo Grid & Falling Pin (Drop animation) -->
  <g transform="translate(860, 60)" class="pindrop">
    <!-- Topo Contour Rings -->
    <path d="M 120 40 Q 180 0, 240 60 Q 300 120, 240 180 Q 180 240, 120 180 Q 60 120, 120 40 Z" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.4"/>
    <path d="M 130 60 Q 180 30, 230 70 Q 270 120, 230 170 Q 180 210, 130 170 Q 90 120, 130 60 Z" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>
    <path d="M 140 80 Q 180 60, 210 90 Q 240 120, 210 160 Q 180 190, 140 160 Q 110 120, 140 80 Z" fill="none" stroke="#a7f3d0" stroke-width="0.8" opacity="0.3"/>
    
    <!-- Key Red Pin -->
    <use href="#icon-pin" x="145" y="80" width="40" height="40" fill="url(#pin-gradient)"/>
  </g>

  <!-- Bottom: Complex Skills Tech Stack (Staggered, Hoverable Tags) -->
  <g transform="translate(60, 360)">
    <!-- ArcGis Pro (Interactive tag) -->
    <g class="skill-tag" transform="translate(0,0)" cursor="pointer">
      <rect width="115" height="34" rx="17" fill="#1e293b" stroke="#0079c1" stroke-width="1"/>
      <text x="57" y="22" font-family="system-ui, -apple-system" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">ArcGis Pro</text>
    </g>
    <!-- QGIS (Interactive tag) -->
    <g class="skill-tag" transform="translate(130,0)" cursor="pointer">
      <rect width="80" height="34" rx="17" fill="#1e293b" stroke="#589632" stroke-width="1"/>
      <text x="40" y="22" font-family="system-ui, -apple-system" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">QGIS</text>
    </g>
    <!-- Python (Interactive tag) -->
    <g class="skill-tag" transform="translate(225,0)" cursor="pointer">
      <rect width="90" height="34" rx="17" fill="#1e293b" stroke="#3776ab" stroke-width="1.5"/>
      <text x="45" y="22" font-family="system-ui, -apple-system" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">Python</text>
    </g>
    <!-- Postgres/PostGIS (Interactive tag) -->
    <g class="skill-tag" transform="translate(330,0)" cursor="pointer">
      <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#336791" stroke-width="1"/>
      <text x="80" y="22" font-family="system-ui, -apple-system" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">PostgreSQL/GIS</text>
    </g>
    <!-- MapLibre/JS (Interactive tag) -->
    <g class="skill-tag" transform="translate(505,0)" cursor="pointer">
      <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#f7df1e" stroke-width="1"/>
      <text x="65" y="22" font-family="system-ui, -apple-system" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">MapLibre GL JS</text>
    </g>
  </g>
</svg>
